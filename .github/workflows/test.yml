name: test

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cfscanner

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux arm64（静态链接 musl）
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: cfscanner-linux-arm64

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # amd64 musl 直接用 musl-tools
      - name: 安装 musl 工具链（amd64）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      # arm64 cross 编译需要 cross 工具
      - name: 安装 cross（arm64）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # amd64 直接 cargo build
      - name: 编译（amd64）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build --release --target ${{ matrix.target }}

      # arm64 用 cross（内部用 Docker 模拟）
      - name: 编译（arm64）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: 准备产物
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             dist/${{ matrix.artifact }}
          # 校验文件
          file dist/${{ matrix.artifact }}
          ls -lh dist/${{ matrix.artifact }}

      - name: 显示产物列表
        run: ls -lh dist/


      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: cfscanner test
          files: |
            dist/cfscanner-linux-arm64
          draft: false
          prerelease: true
