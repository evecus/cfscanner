[package]
name = "cfscanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cfscanner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
webpki-roots = "0.25"
ipnetwork = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
rand = "0.8"
cron = "0.12"
futures-lite = "1"
indicatif = "0.17"

[profile.release]
strip         = "symbols"  # 剥离调试符号表，不影响运行
debug         = false      # 不内嵌调试信息
lto           = "thin"     # 跨 crate 裁掉未调用的代码，thin 构建速度可接受
codegen-units = 1          # 单编译单元，允许更完整的内联分析
